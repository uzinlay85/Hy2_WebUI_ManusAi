# Hysteria 2 Server Configuration (v4.0 - tuned & secure)
# Place this file at: /etc/hysteria/config.yaml
# Replace YOUR_DOMAIN with your actual domain name.
# Replace YOUR_OBFS_PASSWORD and YOUR_STATS_SECRET with random values.

listen: :10443

tls:
  cert: /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem
  key: /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem

# Ultra High-Speed Performance Tuning (16MB Stream / 32MB Conn Buffer)
quic:
  initStreamReceiveWindow: 16777216
  maxStreamReceiveWindow: 16777216
  initConnReceiveWindow: 33554432
  maxConnReceiveWindow: 33554432
  maxIdleTimeout: 60s
  keepAlivePeriod: 5s

# Obfuscation (disabled by default for maximum app compatibility & light connections)
# To re-enable Salamander obfs, see docs/obfs-salamander-guide.md
# obfs:
#   type: salamander
#   salamander:
#     password: YOUR_OBFS_PASSWORD

# Masquerade - disguise probe traffic as normal HTTPS requests
masquerade:
  type: proxy
  proxy:
    url: https://www.bing.com
    rewriteHost: true

auth:
  type: http
  http:
    url: http://127.0.0.1:5000/auth

# Block private ranges (IPv4 + IPv6) to prevent abuse
acl:
  inline:
    - reject(127.0.0.0/8)
    - reject(::1/128)
    - reject(10.0.0.0/8)
    - reject(172.16.0.0/12)
    - reject(192.168.0.0/16)
    - reject(fc00::/7)
    - reject(fe80::/10)
    - direct(all)

trafficStats:
  listen: 127.0.0.1:4000
  secret: YOUR_STATS_SECRET
